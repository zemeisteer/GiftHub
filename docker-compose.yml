version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gifthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gifthub}
      POSTGRES_USER: ${POSTGRES_USER:-gifthub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gifthub_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gifthub_user} -d ${POSTGRES_DB:-gifthub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gifthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gifthub-api
    restart: unless-stopped
    # main.py GRACEFUL_SHUTDOWN_TIMEOUT (25s) dan katta bo'lishi kerak, aks holda SIGKILL keladi
    stop_grace_period: 40s
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${POSTGRES_USER:-gifthub_user}:${POSTGRES_PASSWORD:-gifthub_secure_pass}@postgres:5432/${POSTGRES_DB:-gifthub}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python main.py --mode=api"

  bot:
    build: .
    container_name: gifthub-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${POSTGRES_USER:-gifthub_user}:${POSTGRES_PASSWORD:-gifthub_secure_pass}@postgres:5432/${POSTGRES_DB:-gifthub}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bot rejimida HTTP server yo'q: Dockerfile'dagi /health tekshiruvi doim yiqilardi.
    # Jarayon to'xtasa, restart: unless-stopped uni qayta ishga tushiradi.
    healthcheck:
      disable: true
    stop_grace_period: 20s
    command: python main.py --mode=bot

  worker:
    build: .
    container_name: gifthub-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${POSTGRES_USER:-gifthub_user}:${POSTGRES_PASSWORD:-gifthub_secure_pass}@postgres:5432/${POSTGRES_DB:-gifthub}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker HTTP server ochmaydi — uning Redis'dagi heartbeat'i tekshiriladi
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Worker joriy siklini (outbox/to'lov) tugatib chiqishi uchun vaqt
    stop_grace_period: 40s
    command: python main.py --mode=worker

volumes:
  pgdata:
  redisdata:
